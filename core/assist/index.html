<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Assist</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="assist.css">
  <script type="module" src="assist.js"></script>
</head>
<body>
  <main>
    <h1 id="heading">Ask about this page</h1>
    <p id="about" class="soft"></p>
    <form id="ask">
      <label for="question" class="soft">Your question</label>
      <div class="row">
        <input id="question" autocomplete="off" spellcheck="true" maxlength="500" placeholder="Ask, or /skill">
        <button class="primary" id="go">Ask</button>
      </div>
      <div class="row mentions">
        <select id="mention" aria-label="Also read another tab or a folder"><option value="">Also read…</option></select>
        <ul id="chips" class="chips" aria-label="Also reading"></ul>
      </div>
    </form>
    <p id="queued" class="soft" hidden></p>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="cancel" hidden>Cancel</button>
    <section id="answer" hidden aria-labelledby="answer-title">
      <h2 id="answer-title">Answer</h2>
      <p id="answer-text"></p>
      <p id="answer-note" class="soft"></p>
    </section>
    <section id="evidence" hidden aria-labelledby="evidence-title">
      <h2 id="evidence-title">Where the page says it</h2>
      <ol id="passages"></ol>
    </section>
    <details id="skills-box">
      <summary>Skills</summary>
      <p class="soft">A skill is saved instructions: type <code>/name</code> and a question. Skills are notes named "Skill …", so you can edit them in your notes.</p>
      <ul id="skills" class="skills"></ul>
      <form id="new-skill">
        <label class="soft">Name <input id="skill-name" maxlength="60" autocomplete="off"></label>
        <label class="soft">What it should do <textarea id="skill-does" rows="2" maxlength="1000" placeholder="e.g. Explain the page to a ten-year-old, in five sentences."></textarea></label>
        <button type="submit">Save the skill</button>
      </form>
    </details>
    <details id="style-box">
      <summary>Your style</summary>
      <label class="soft" for="style">How answers should read (style only: it never adds facts)</label>
      <textarea id="style" rows="2" maxlength="500" placeholder="e.g. Answer in Dutch, in short sentences."></textarea>
      <p><button type="button" id="style-save">Save</button></p>
      <label class="switch soft"><input type="checkbox" id="chats"> Keep answers in a note, "Assist chats"</label>
    </details>
    <footer class="soft" id="footer"></footer>
  </main>
</body>
</html>
