name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Attach the kit to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Xiao $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" dist/xiao-kit.zip --clobber
      - name: Sign the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          XIAO_UPDATE_KEY: ${{ secrets.XIAO_UPDATE_KEY }}
        run: |
          node scripts/sign-updates.mjs "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/updates.json dist/updates.json.sig --clobber
