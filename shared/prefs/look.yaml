#
# xiao's look, for the kit and the fork: Zen's own UI in xiao red (--brand in
# shared/tokens.css) and no Zen logo on startup. Not hardening, so the privacy
# page doesn't list these.

- name: zen.theme.accent-color
  value: "#e70923"
- name: zen.watermark.enabled
  value: false
# Ctrl+Tab goes to the tab used last, as Arc's recent-tab switcher does, not the next one along.
- name: browser.ctrlTab.sortByRecentlyUsed
  value: true
