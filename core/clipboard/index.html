<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipboard history</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../send/send.css">
  <style>
    ol { list-style: none; padding: 0; margin: 0; }
    li { display: flex; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--rule); }
    li pre { flex: 1; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 8em; overflow: hidden; font: var(--step--1) / 1.4 var(--sans); }
    #pasted { min-height: 3em; }
    dl { font-size: var(--step--1); } dt { font-weight: 600; } dd { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-soft); }
  </style>
  <script src="clipboard.js" type="module"></script>
</head>
<body>
  <main>
    <h1>Clipboard history</h1>
    <p class="lede">What you copied from pages in Xiao, on this computer only: the last 50. Never password fields, private windows or Tor tabs.</p>
    <p class="actions"><button id="clear" type="button">Clear all</button></p>
    <ol id="clips"></ol>
    <p id="status" role="status"></p>
    <h2>What's on the clipboard?</h2>
    <p class="lede">Paste here to see every format the clipboard holds. Nothing is kept.</p>
    <textarea id="pasted" aria-label="Paste here"></textarea>
    <dl id="kinds"></dl>
  </main>
</body>
</html>
