<!-- site/public/og.png, the link preview. After npm run site:assets, render it with:
   zen -profile <empty dir> -no-remote --headless --window-size=1200,630 --screenshot site/public/og.png "file://$PWD/site/og.html" -->
<meta charset="utf-8"><link rel="stylesheet" href="public/tokens.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans)}
.pool{position:absolute;inset:auto -10% -40%;height:70%;background:radial-gradient(55% 60% at 30% 50%,var(--pool-a),transparent 70%),radial-gradient(45% 55% at 72% 50%,var(--pool-b),transparent 70%);filter:blur(40px)}
main{position:relative;padding:72px 84px}
.brand{display:flex;gap:14px;align-items:center;font-weight:650;font-size:34px}
h1{margin:70px 0 0;font-size:118px;line-height:.98;font-weight:650;letter-spacing:-.04em}
em{font-family:var(--serif);font-weight:400;color:var(--accent-text);letter-spacing:-.02em}
p{margin:34px 0 0;font-size:30px;color:var(--ink-soft)}
</style>
<div class="pool"></div><main><div class="brand"><img src="public/favicon.svg" width="44" height="44">Xiao</div>
<h1>A <em>calm</em> browser,<br>doors <em>locked</em>.</h1><p>Zen with blocking built in, hardened settings and Tor tabs.</p></main>
