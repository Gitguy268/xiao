<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Xiao app icon: the ring-and-dot mark on a dark rounded square (Apple's 824 px icon grid) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e70923"/>
      <stop offset="1" stop-color="#f32500"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242423"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#g)" stroke-width="46"/>
  <circle cx="512" cy="512" r="82" fill="url(#g)"/>
</svg>
