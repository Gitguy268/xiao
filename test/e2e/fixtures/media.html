<!doctype html>
<meta charset="utf-8">
<title>A song</title>
<p id="hideme">An element a Boost can hide</p>
<audio id="a" loop></audio>
<script>
  // two seconds of a 440 Hz tone, made here so the fixture needs no media file
  const rate = 8000, n = rate * 2, buf = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, s) => [...s].forEach((c, i) => buf.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); buf.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); buf.setUint32(16, 16, true);
  buf.setUint16(20, 1, true); buf.setUint16(22, 1, true); buf.setUint32(24, rate, true); buf.setUint32(28, rate * 2, true);
  buf.setUint16(32, 2, true); buf.setUint16(34, 16, true); str(36, 'data'); buf.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) buf.setInt16(44 + i * 2, Math.sin(i * 2 * Math.PI * 440 / rate) * 8000, true);
  const a = document.getElementById('a');
  a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  navigator.mediaSession.metadata = new MediaMetadata({ title: 'A song', artist: 'Xiao test' });
  if (location.hash === '#play') a.play();
  // chrome code reads the tab title: whether a Boost hides the paragraph
  setInterval(() => { document.title = (getComputedStyle(document.getElementById('hideme')).display === 'none' ? 'A song (hidden)' : 'A song') + (a.paused ? '' : ' playing'); }, 200);
</script>
