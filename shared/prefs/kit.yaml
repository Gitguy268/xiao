#
# Kit only: lets the official Zen load xiao's unsigned extension from the
# profile folder. The fork ships the extension as a built-in add-on instead.

- name: xpinstall.signatures.required
  value: false
- name: extensions.autoDisableScopes
  value: 0
- name: extensions.enabledScopes
  value: 15
- name: browser.shell.checkDefaultBrowser
  value: false
# Zen's onboarding is Zen-branded; the fork shows its own.
- name: zen.welcome-screen.seen
  value: true
