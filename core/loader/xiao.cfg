// Xiao (MPL-2.0). AutoConfig skips this first line.
// Maps resource://xiao/ to the xiao folder next to this file and starts Xiao's
// browser code (xiao/XiaoCore.sys.mjs) once the profile is known, before any
// window or tab opens.
try {
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("xiao");
  Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("xiao", Services.io.newFileURI(dir));
  const start = {
    observe() {
      Services.obs.removeObserver(start, "profile-after-change");
      ChromeUtils.importESModule("resource://xiao/XiaoCore.sys.mjs").Xiao.init();
    },
  };
  Services.obs.addObserver(start, "profile-after-change");
} catch (e) {
  Cu.reportError(e);
}
